services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d knowledge_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: